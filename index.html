<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="股票記帳">
<title>股票買賣記帳本</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  :root {
    --ink: #E9ECF1;
    --ink-soft: rgba(233,236,241,0.82);
    --ink-faint: rgba(233,236,241,0.64);
    --paper: #0B0F14;
    --panel: #131922;
    --rule: #232B36;
    --rule-strong: #313B47;
    --gain: #F5464F;
    --loss: #2ED47A;
    --accent: #33BFF0;
    --accent-ink: #04202B;
    --radius-lg: 12px;
    --radius-md: 8px;
    --radius-sm: 7px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Helvetica Neue", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  button, input, textarea { font-family: inherit; }

  .mono { font-family: ui-monospace, "SF Mono", Menlo, "Cascadia Code", monospace; }

  button { touch-action: manipulation; }

  input:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  .app {
    max-width: 860px;
    margin: 0 auto;
    padding-top: max(32px, env(safe-area-inset-top));
    padding-right: max(20px, env(safe-area-inset-right));
    padding-bottom: max(64px, env(safe-area-inset-bottom));
    padding-left: max(20px, env(safe-area-inset-left));
  }

  /* ---------- Header ---------- */
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .app-header h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .app-header .subtitle {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0;
  }
  .btn-primary {
    background: linear-gradient(135deg, #6BE0FB, var(--accent) 65%);
    color: var(--accent-ink);
    border: none;
    padding: 12px 20px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.12s;
    min-height: 44px;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:active { opacity: 0.75; }

  /* ---------- Summary hero (return ring + metrics) ---------- */
  .summary-hero {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--panel);
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-lg);
    margin-bottom: 18px;
    padding: 12px 18px;
    flex-wrap: wrap;
  }
  .ring-wrap {
    position: relative;
    width: 128px;
    height: 128px;
    flex-shrink: 0;
  }
  .ring-svg { width: 100%; height: 100%; overflow: visible; }
  .ring-svg circle { transition: stroke 0.3s; }
  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 3px;
  }
  .ring-value-row { display: flex; align-items: center; justify-content: center; gap: 3px; }
  .ring-direction { font-size: 12px; line-height: 1; color: var(--gain); }
  .ring-direction.loss { color: var(--loss); }
  .ring-value {
    font-size: 18px;
    font-weight: 750;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    white-space: nowrap;
  }
  .ring-label { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.04em; line-height: 1.3; }
  .hero-metrics {
    flex: 1;
    min-width: 190px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .hero-metric {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13.5px;
  }
  .hero-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .hero-dot.dot-accent { background: var(--accent); }
  .hero-dot.dot-neutral { background: var(--ink-faint); }
  .hero-dot.gain { background: var(--gain); }
  .hero-dot.loss { background: var(--loss); }
  .hero-metric-label { color: var(--ink-soft); flex: 1; }
  .hero-metric-value {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .hero-metric-value.gain { color: var(--gain); }
  .hero-metric-value.loss { color: var(--loss); }

  .inventory-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 16px; margin-top:10px; padding-top:10px; border-top:1px solid var(--rule); }
  .inventory-cell { display:flex; flex-direction:column; gap:3px; min-width:0; }
  .inventory-cell-label { color:var(--ink-soft); font-size:11px; }
  .inventory-cell-value { color:var(--ink); font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  .inventory-table-wrap { width:100%; overflow-x:auto; border:1px solid var(--rule-strong); border-radius:var(--radius-md); background:var(--panel); }
  .inventory-table { width:100%; min-width:900px; border-collapse:collapse; font-size:12px; }
  .inventory-table th, .inventory-table td { padding:11px 13px; border-bottom:1px solid var(--rule); text-align:left; white-space:nowrap; }
  .inventory-table th { color:var(--ink-soft); font-size:11px; font-weight:600; }
  .inventory-table tr:last-child td { border-bottom:none; }
  .inventory-stock-cell { display:flex; flex-direction:column; gap:2px; }
  .inventory-stock-cell strong { color:var(--ink); font-size:12px; }
  .inventory-stock-cell span { color:var(--ink-soft); font-size:11px; }
  .inventory-table .num-cell { text-align:right; font-variant-numeric:tabular-nums; }
  .inventory-table .inventory-note { min-width:130px; max-width:220px; white-space:normal; overflow-wrap:anywhere; color:var(--ink-soft); }
  .inventory-table .inventory-actions { display:flex; align-items:center; gap:8px; }
  .sale-card-header { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:baseline; gap:4px 12px; margin-bottom:7px; }
  .sale-stock-identity { grid-column:1; grid-row:1; display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 9px; margin:0; }
  .sale-stock-identity strong { color:var(--accent); font-size:12px; }
  .sale-stock-identity span { color:var(--ink); font-size:12px; }
  .sale-unit-price { grid-column:2; grid-row:1; }
  .sale-event-meta { grid-column:1; grid-row:2; color:var(--ink-soft); font-size:12px; }
  .sale-quantity { grid-column:2; grid-row:2; justify-self:end; color:var(--ink-soft); font-size:12px; white-space:nowrap; }
  .sale-quantity strong { color:var(--ink); font-size:14px; font-variant-numeric:tabular-nums; }
  @media (max-width:480px) { .inventory-table { min-width:850px; } }


  /* ---------- Toolbar ---------- */
  .search-input {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
    padding: 11px 13px;
    font-size: 16px;
    margin-bottom: 14px;
    background: var(--panel);
    color: var(--ink);
  }
  .search-input::placeholder { color: var(--ink-faint); }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }
  .toolbar-left {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .filter-tabs, .view-toggle {
    display: flex;
    gap: 3px;
    background: var(--panel);
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
    padding: 3px;
  }
  .filter-tab, .view-tab {
    border: none;
    background: transparent;
    padding: 9px 15px;
    border-radius: 5px;
    font-size: 13.5px;
    color: var(--ink-soft);
    cursor: pointer;
    font-weight: 500;
    min-height: 40px;
  }
  .filter-tab.active, .view-tab.active {
    background: linear-gradient(135deg, #6BE0FB, var(--accent) 65%);
    color: var(--accent-ink);
  }
  .toolbar-actions { display: flex; flex-wrap: wrap; gap: 8px 14px; }
  .btn-link {
    background: none;
    border: none;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    padding: 8px 2px;
  }
  .btn-link:hover { color: var(--ink); }
  .btn-link:active { opacity: 0.6; }
  .btn-link-danger:hover { color: var(--gain); }

  /* ---------- Ledger ---------- */
  .ledger {
    background: var(--panel);
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .entry {
    padding: 16px 20px 18px;
    border-bottom: 1px solid var(--rule);
    transition: background-color 0.12s;
  }
  .ledger .entry:last-child { border-bottom: none; }
  .entry:hover { background-color: rgba(255,255,255,0.025); }

  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .entry-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .stock-name { font-size: 15.5px; font-weight: 700; }
  .ticker { font-size: 12.5px; color: var(--ink-soft); }

  .status-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1.5px solid var(--ink-soft);
    flex-shrink: 0;
  }
  .status-dot.realized { background: var(--ink); border-color: var(--ink); }
  .status-dot.holding { background: var(--accent); border-color: var(--accent); }

  .entry-line {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 3px 14px;
    font-size: 13.5px;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .entry-tag {
    color: var(--ink-soft);
    min-width: 34px;
    flex-shrink: 0;
  }
  .entry-line .num { font-variant-numeric: tabular-nums; }

  .entry-summary {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--rule);
    font-size: 13.5px;
  }
  .sum-row {
    display: flex;
    justify-content: space-between;
    padding: 2px 0;
  }
  .sum-row .label { color: var(--ink-soft); }
  .sum-row .value { font-variant-numeric: tabular-nums; font-weight: 600; }
  .pnl-row {
    font-size: 15px;
    font-weight: 700;
    margin-top: 6px;
    padding-top: 8px;
    border-top: 1px solid var(--rule);
  }
  .pnl-row .pct { font-size: 13px; font-weight: 600; }
  .pnl-row.gain .value { color: var(--gain); }
  .pnl-row.loss .value { color: var(--loss); }

  .effect-row {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 12px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .effect-row .gain { color: var(--gain); }
  .effect-row .loss { color: var(--loss); }

  .header-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .event-type-switch { display:flex; gap:8px; margin:0 0 14px; }
  .event-type-switch label { display:flex; align-items:center; gap:6px; padding:9px 13px; border:1px solid var(--rule-strong); border-radius:7px; color:var(--ink-soft); cursor:pointer; }
  .event-type-switch input { accent-color:var(--accent); }
  .form-hint { margin-top:8px; color:var(--ink-soft); font-size:12px; line-height:1.5; }
  .offset-disclosure { margin-top:10px; padding-top:9px; border-top:1px solid var(--rule); }
  .offset-disclosure summary { display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; list-style:none; color:var(--accent); font-size:14px; font-weight:700; }
  .offset-disclosure summary::-webkit-details-marker { display:none; }
  .offset-disclosure summary::after { content:'⌄'; color:var(--accent); font-size:18px; line-height:1; }
  .offset-disclosure[open] summary::after { content:'⌃'; }
  .offset-list { display:grid; gap:9px; margin-top:10px; }
  .offset-row { display:grid; gap:9px; padding:11px; border:1px solid var(--rule-strong); border-radius:7px; background:#0d141c; color:var(--ink-soft); font-size:13px; line-height:1.5; }
  .offset-row strong { color:var(--ink); font-size:14px; }
  .offset-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .offset-cell { display:grid; gap:3px; min-width:0; padding:8px 9px; border-radius:6px; background:#141d27; }
  .offset-label { color:var(--ink-soft); font-size:12px; }
  .offset-value { color:var(--ink); font-size:13px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  .offset-total { display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding-top:8px; border-top:1px solid var(--rule); color:var(--ink); font-size:13px; }
  .offset-total strong { font-size:15px; }
  .offset-total.gain, .offset-total.gain strong { color:var(--gain); } .offset-total.loss, .offset-total.loss strong { color:var(--loss); }
  .sale-open-note { margin-top:7px; color:var(--ink-soft); font-size:12px; }
  .entry-actions {
    display: flex;
    justify-content: flex-end;
    gap: 16px;
    margin-top: 10px;
  }


  .trade-sections { display:grid; gap:11px; margin-top:14px; padding-top:12px; border-top:1px solid var(--rule); }
  .trade-panel, .sale-card { border:1px solid var(--rule-strong); border-radius:8px; background:#10161e; padding:12px; }
  .buy-panel { border-left:3px solid var(--accent); }
  .trade-panel-header, .trade-section-heading { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:7px; }
  .trade-panel-title, .trade-section-title { font-size:13px; font-weight:700; letter-spacing:.04em; }
  .buy-panel .trade-panel-title { color:var(--accent); }
  .trade-panel-count, .trade-section-count { color:var(--ink-soft); font-size:12px; }
  .trade-panel-total { color:var(--ink); font-size:13px; font-weight:700; white-space:nowrap; }
  .trade-list { display:flex; flex-direction:column; }
  .trade-row { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:9px 0; border-top:1px solid var(--rule); }
  .trade-row-main { min-width:0; }
  .trade-row-heading { display:flex; flex-wrap:wrap; align-items:baseline; gap:5px 10px; }
  .trade-date { color:var(--ink-faint); font-size:12px; }
  .trade-quantity { color:var(--ink); font-size:13px; font-weight:700; }
  .trade-row-details, .sale-card-details { display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:5px; color:var(--ink-soft); font-size:12px; font-variant-numeric:tabular-nums; }
  .trade-note { display:block; margin-top:5px; color:var(--ink-soft); font-size:12px; white-space:normal; }
  .trade-row-actions { display:flex; flex-shrink:0; gap:7px; }
  .trade-row-actions .btn-link, .sale-card .btn-link { font-size:11px; }
  .sales-section { display:grid; gap:7px; }
  .trade-section-heading { margin:0 2px; }
  .sales-section .trade-section-title { color:var(--gain); }
  .sale-card { padding:10px 12px; }
  .sale-card-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .sale-card-date { color:var(--ink-soft); font-size:11px; }
  .sale-card-quantity { display:block; margin-top:2px; color:var(--ink); font-size:12px; font-weight:700; }
  .sale-card-pnl { font-size:12px; font-weight:700; text-align:right; white-space:nowrap; }
  .sale-card-pnl.gain, .sale-return.gain { color:var(--gain); }
  .sale-card-pnl.loss, .sale-return.loss { color:var(--loss); }
  .sale-card-footer { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:8px; }
  .sale-overview-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 14px; padding:8px 0 4px; border-top:1px solid var(--rule); }
  .sale-overview-cell { display:flex; align-items:baseline; justify-content:space-between; gap:8px; font-size:13px; }
  .sale-overview-cell span { color:var(--ink-soft); }
  .sale-overview-cell strong { color:var(--ink); font-size:13px; font-variant-numeric:tabular-nums; text-align:right; }
  .sale-overview-cell.pnl.gain strong { color:var(--gain); }
  .sale-overview-cell.pnl.loss strong { color:var(--loss); }
  .sale-return { font-size:11px; font-weight:700; }
  .pnl-number { font-variant-numeric:tabular-nums; white-space:normal; }
  .pnl-number.gain, .pnl-percent.gain { color:var(--gain); font-weight:700; }
  .pnl-number.loss, .pnl-percent.loss { color:var(--loss); font-weight:700; }
  .pnl-percent { font-size:12px; white-space:nowrap; }
  @media (max-width:480px) {
    .trade-panel, .sale-card { padding:10px; }
    .trade-row { gap:5px; }
    .trade-row-actions { flex-direction:column; gap:1px; }
    .trade-row-actions .btn-link { padding:4px 2px; }
    .sale-card-head { align-items:flex-start; }
  }

  .empty-state, .loading-state {
    text-align: center;
    padding: 56px 20px;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-lg);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .trade-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .trade-table th {
    text-align: left;
    padding: 11px 14px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--rule-strong);
    white-space: nowrap;
  }
  .trade-table th.sortable { cursor: pointer; user-select: none; touch-action: manipulation; }
  .trade-table th.sortable:active { color: var(--ink); }
  .trade-table th.sortable.active { color: var(--accent); }
  .trade-table td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--rule);
    border-right: 1px solid rgba(255,255,255,0.04);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .trade-table td:last-child { border-right: none; }
  .trade-table tbody tr { cursor: pointer; }
  .trade-table tbody tr:last-child td { border-bottom: none; }
  .trade-table tbody tr:active { background: rgba(255,255,255,0.04); }
  .trade-table th.num-cell, .trade-table td.num-cell { text-align: right; }
  .trade-table td.gain { color: var(--gain); font-weight: 600; }
  .trade-table td.loss { color: var(--loss); font-weight: 600; }
  .trade-table .cell-ticker { font-weight: 700; }
  .trade-table .cell-name { color: var(--ink-soft); font-weight: 400; font-size: 12px; display: block; }
  .trade-table th:first-child, .trade-table td:first-child {
    position: sticky;
    left: 0;
    background: var(--panel);
  }

  .storage-warning {
    background: var(--panel);
    border: 1px solid var(--rule-strong);
    border-left: 3px solid #E0A83E;
    border-radius: var(--radius-md);
    padding: 11px 14px;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(2,4,7,0.66);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--rule-strong);
    border-radius: 14px;
    padding: 22px;
    width: 100%;
    max-width: 460px;
    max-height: 90vh;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .modal h2 { font-size: 17px; margin: 0 0 16px; color: var(--ink); }

  fieldset {
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-md);
    padding: 14px 14px 4px;
    margin: 0 0 14px;
  }
  legend {
    font-size: 12.5px;
    color: var(--ink-soft);
    padding: 0 6px;
    font-weight: 600;
  }

  .form-row { display: flex; gap: 10px; }
  .form-row > div { flex: 1; min-width: 0; }
  @media (max-width: 380px) {
    .form-row { flex-direction: column; gap: 0; }
  }

  .field-label {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
    display: block;
  }
  input, textarea {
    width: 100%;
    border: 1px solid var(--rule-strong);
    border-radius: 6px;
    padding: 10px 11px;
    font-size: 16px;
    margin-bottom: 10px;
    background: var(--panel);
    color: var(--ink);
  }
  textarea { min-height: 56px; resize: vertical; }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 6px;
  }
  .modal-actions .btn-primary, .modal-actions .btn-secondary { flex: 1 1 auto; }
  #cancelBtn { flex-grow: 0; }
  .btn-secondary {
    background: var(--panel);
    border: 1px solid var(--rule-strong);
    padding: 12px 18px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    cursor: pointer;
    color: var(--ink);
    min-height: 44px;
  }
  .btn-secondary:hover { background: var(--paper); }
  .btn-secondary:active { background: var(--rule); }

  /* ---------- Confirm dialog ---------- */
  .confirm-modal { max-width: 340px; text-align: center; }
  .confirm-message { font-size: 14.5px; line-height: 1.6; margin: 2px 0 18px; color: var(--ink); }
  .confirm-actions { justify-content: center; }
  .btn-danger-solid {
    background: var(--gain);
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    min-height: 44px;
    flex: 1 1 auto;
  }
  .btn-danger-solid:active { opacity: 0.78; }

  /* ---------- Toast ---------- */
  .toast-container {
    position: fixed;
    left: 50%;
    bottom: max(24px, calc(16px + env(safe-area-inset-bottom, 0px)));
    transform: translateX(-50%);
    z-index: 300;
    display: flex;
    flex-direction: column-reverse;
    gap: 8px;
    width: calc(100% - 40px);
    max-width: 420px;
    pointer-events: none;
  }
  .toast {
    background: var(--panel);
    border: 1px solid var(--rule-strong);
    border-left: 3px solid var(--ink-faint);
    border-radius: var(--radius-md);
    padding: 12px 15px;
    font-size: 13.5px;
    color: var(--ink);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.22s, transform 0.22s;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast-error { border-left-color: var(--gain); }
  .toast-success { border-left-color: var(--loss); }

  @media (max-width: 480px) {
    .app {
      padding-top: max(20px, env(safe-area-inset-top));
      padding-right: max(14px, env(safe-area-inset-right));
      padding-bottom: max(60px, env(safe-area-inset-bottom));
      padding-left: max(14px, env(safe-area-inset-left));
    }
    .app-header h1 { font-size: 19px; }
    .modal { padding: 18px; }
    .modal-overlay { align-items: flex-start; padding-top: max(36px, env(safe-area-inset-top)); }
  }
</style>
</head>
<body>

<div class="app">
  <div id="storageWarning" class="storage-warning" style="display:none">⚠️ 這個瀏覽器目前無法使用本機儲存功能（可能在無痕模式，或封鎖了網站資料）。紀錄只會保留到這個分頁關閉為止，建議改用一般瀏覽模式開啟這個檔案。</div>
  <header class="app-header">
    <div>
      <h1>股票買賣記帳本</h1>
      <p class="subtitle">整理買入、賣出與目前庫存明細</p>
      <p class="subtitle">iPhone 安裝：先將此頁放到網站網址，再用 Safari「分享」→「加入主畫面」→「以網頁 App 開啟」</p>
    </div>
    <div class="header-actions"><button id="addBtn" class="btn-primary">+ 新增交易</button></div>
  </header>

  <section class="summary-hero glass-edge">
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="49" fill="none" stroke="var(--rule)" stroke-width="9"/>
        <circle cx="60" cy="60" r="49" fill="none" id="ringFill" stroke="var(--gain)" stroke-width="9" stroke-linecap="round" transform="rotate(-90 60 60)"/>
      </svg>
      <div class="ring-center">
        <div class="ring-value-row"><span class="ring-direction" id="ringDirection">▲</span><span class="ring-value mono" id="ringValue">--</span></div>
        <div class="ring-label">已實現<br>報酬率</div>
      </div>
    </div>
    <div class="hero-metrics">
      <div class="hero-metric"><span class="hero-dot dot-neutral" id="pnlDot"></span><span class="hero-metric-label">賣出損益</span><span class="hero-metric-value" id="summaryPnl">--</span></div>
      <div class="hero-metric"><span class="hero-dot dot-accent"></span><span class="hero-metric-label">持有成本</span><span class="hero-metric-value" id="summaryHoldingCost">--</span></div>
      <div class="hero-metric"><span class="hero-dot dot-neutral"></span><span class="hero-metric-label">總筆數</span><span class="hero-metric-value" id="summaryTotal">0</span></div>
      <div class="hero-metric"><span class="hero-dot dot-neutral"></span><span class="hero-metric-label">持有中</span><span class="hero-metric-value" id="summaryHolding">0</span></div>
    </div>
  </section>

  <input type="search" id="searchInput" class="search-input" placeholder="搜尋股票名稱或代號" autocomplete="off">

  <div class="toolbar">
    <div class="toolbar-left">
      <div class="view-toggle">
        <button class="view-tab active" data-view="details">明細</button>
        <button class="view-tab" data-view="inventory">庫存</button>
      </div>
    </div>
    <div class="toolbar-actions">
      <button id="exportBtn" class="btn-link">匯出 CSV</button>
      <button id="backupBtn" class="btn-link">備份</button>
      <button id="restoreBtn" class="btn-link">還原</button>
      <button id="clearBtn" class="btn-link btn-link-danger">清除全部</button>
    </div>
    <input type="file" id="restoreFileInput" accept="application/json" style="display:none">
  </div>

  <div class="ledger glass-edge" id="ledgerPanel">
    <div id="tradeList"></div>
  </div>
  <div class="table-wrap glass-edge" id="tableWrap" style="display:none">
    <table class="trade-table">
      <thead>
        <tr id="tableHeadRow">
          <th>股票</th>
          <th>買入日期</th>
          <th>狀態</th>
          <th class="num-cell">損益</th>
          <th class="num-cell">報酬率</th>
        </tr>
      </thead>
      <tbody id="tradeTableBody"></tbody>
    </table>
  </div>
  <div id="emptyState" class="empty-state" style="display:none"></div>
</div>

<div id="modal" class="modal-overlay" style="display:none">
  <div class="modal glass-edge">
    <h2 id="modalTitle">新增交易</h2>
    <form id="tradeForm">
      <input type="hidden" id="eventTypeValue" name="eventType" value="buy">
      <fieldset><legend>股票資訊</legend>
        <label class="field-label">股票名稱</label><input name="stockName" required placeholder="例：台積電 ADR" list="stockNameList" autocomplete="off">
        <label class="field-label">股票代號</label><input name="ticker" required placeholder="例：TSM" list="tickerList" autocomplete="off">
        <datalist id="stockNameList"></datalist><datalist id="tickerList"></datalist>
        <label class="field-label">幣別</label><input name="currency" required value="USD" placeholder="USD">
      </fieldset>
      <fieldset><legend id="eventFieldsTitle">買入資訊</legend>
        <label class="field-label" id="sharesFieldLabel">買入股數</label><input name="shares" type="number" step="any" min="0.0001" required placeholder="100">
        <label class="field-label" id="dateFieldLabel">買入日期</label><input id="eventDateInput" name="dateTime" type="date" required>
        <div class="form-row"><div><label class="field-label" id="priceFieldLabel">買入股價</label><input name="price" type="number" step="any" min="0" required placeholder="0.00"></div><div><label class="field-label" id="fxFieldLabel">買入匯率</label><input name="fxRate" type="number" step="any" min="0" required placeholder="31.50"></div></div>
        <div id="offsetHelp" class="form-hint" style="display:none">賣出先配對最早尚未沖銷的買入；超出持股的賣出，之後買入會依時間沖銷。</div>
      </fieldset>
      <label class="field-label">備註</label><textarea name="notes" placeholder="選填"></textarea>
      <div class="modal-actions"><button type="button" id="cancelBtn" class="btn-secondary">取消</button><button type="submit" id="saveAddAnotherBtn" class="btn-secondary">儲存並新增下一筆</button><button type="submit" class="btn-primary">儲存</button></div>
    </form>
  </div>
</div>

<div id="confirmOverlay" class="modal-overlay confirm-overlay" style="display:none">
  <div class="modal confirm-modal">
    <p id="confirmMessage" class="confirm-message"></p>
    <div class="modal-actions confirm-actions">
      <button type="button" id="confirmCancelBtn" class="btn-secondary">取消</button>
      <button type="button" id="confirmOkBtn" class="btn-danger-solid">確定</button>
    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script>
  let trades = [];
  let currentFilter = 'all';
  let currentView = 'details';
  let searchQuery = '';
  let editingId = null;

  /* ---------- helpers and transaction migration ---------- */
  function makeTradeId() { return 'trade_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
  function stockIdentityKey(t) {
    const ticker=String(t.ticker||'').trim().toUpperCase(), identity=ticker||String(t.stockName||'').trim().toLowerCase();
    return identity+'::'+String(t.currency||'').trim().toUpperCase();
  }
  function eventTime(t) {
    const value=String(t.dateTime||''), normalized=/^\d{4}-\d{2}-\d{2}$/.test(value)?value+'T00:00:00':value;
    const time=new Date(normalized).getTime(); return isNaN(time)?0:time;
  }
  function normalizeTransactions(records) {
    const result=[];
    (Array.isArray(records)?records:[]).forEach(function(t,index) {
      if (!t||typeof t!=='object') return;
      if ((t.type==='buy'||t.type==='sell')&&t.dateTime) {
        result.push({id:String(t.id||makeTradeId()),type:t.type,stockName:String(t.stockName||''),ticker:String(t.ticker||'').trim().toUpperCase(),currency:String(t.currency||'USD').trim().toUpperCase(),shares:Number(t.shares)||0,dateTime:String(t.dateTime),price:Number(t.price),fxRate:Number(t.fxRate),notes:String(t.notes||'')}); return;
      }
      if (t.buyDateTime&&t.stockName&&t.ticker) {
        const id=String(t.id||makeTradeId()+'_'+index), common={stockName:String(t.stockName),ticker:String(t.ticker).trim().toUpperCase(),currency:String(t.currency||'USD').trim().toUpperCase()};
        result.push(Object.assign({id:id,type:'buy',shares:Number(t.shares)||0,dateTime:String(t.buyDateTime),price:Number(t.buyPrice),fxRate:Number(t.buyFxRate),notes:String(t.notes||'')},common));
        const sold=Number(t.sellShares||t.shares)||0;
        if(t.sellDateTime&&t.sellPrice!=null&&t.sellFxRate!=null&&sold>0) result.push(Object.assign({id:id+'_sale',type:'sell',shares:sold,dateTime:String(t.sellDateTime),price:Number(t.sellPrice),fxRate:Number(t.sellFxRate),notes:''},common));
      }
    }); return result;
  }
  function isValidEvent(t) { return t&&(t.type==='buy'||t.type==='sell')&&t.id&&t.stockName&&t.ticker&&t.dateTime&&Number(t.shares)>0&&isFinite(Number(t.price))&&Number(t.price)>=0&&isFinite(Number(t.fxRate))&&Number(t.fxRate)>=0; }
  function formatEventDate(t) { return t.type==='buy'?formatDate(t.dateTime):formatDateTime(t.dateTime); }

    function formatNum(num, decimals) {
    if (decimals === undefined) decimals = 2;
    if (num === null || num === undefined || isNaN(num)) return '--';
    return Number(num).toLocaleString('zh-TW', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }

  function formatShares(num) {
    if (num === null || num === undefined || isNaN(num)) return '--';
    return Number(num).toLocaleString('zh-TW', { maximumFractionDigits: 4 });
  }

  function formatTWD(num) {
    if (num === null || num === undefined || isNaN(num)) return '--';
    return 'NT$ ' + Math.round(num).toLocaleString('zh-TW');
  }

  function formatSigned(num) {
    if (num === null || num === undefined || isNaN(num)) return '--';
    const mark = num > 0 ? '▲ ' : num < 0 ? '▼ ' : '';
    return mark + 'NT$ ' + Math.abs(Math.round(num)).toLocaleString('zh-TW');
  }

  function formatSignedPct(num) {
    if (num === null || num === undefined || isNaN(num)) return '--';
    const mark = num > 0 ? '▲' : num < 0 ? '▼' : '';
    return mark + Math.abs(num).toFixed(1) + '%';
  }

  function formatPnlWithPct(amount, basis) {
    if (amount === null || amount === undefined || isNaN(amount)) return '--';
    const cls=amount>0?'gain':amount<0?'loss':'',pct=Number(basis)>0?' <span class="pnl-percent '+cls+'">('+formatSignedPct(Number(amount)/Number(basis)*100)+')</span>':'';
    return '<span class="pnl-number '+cls+'">'+formatSigned(amount)+pct+'</span>';
  }

  function formatDateTime(dtStr) {
    if (!dtStr) return '';
    const d = new Date(dtStr);
    if (isNaN(d.getTime())) return dtStr;
    const pad = function(n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const parts = String(dateStr).split('-');
    if (parts.length !== 3) return dateStr;
    return parts[0] + '/' + parts[1] + '/' + parts[2];
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str === null || str === undefined ? '' : String(str);
    return div.innerHTML;
  }

  /* ---------- storage ----------
     Uses the browser's own localStorage, keyed to this file. That means records
     persist through closing the tab, closing the browser, even restarting the
     computer — as long as you keep reopening this same file in the same browser. */
  const STORAGE_KEY = 'stock_trade_tracker_trades_v1';

  function hasLocalStorage() {
    try {
      const testKey = '__stock_tracker_test__';
      localStorage.setItem(testKey, '1');
      localStorage.removeItem(testKey);
      return true;
    } catch (e) {
      return false;
    }
  }

  function loadTrades() {
    if(!hasLocalStorage()) { document.getElementById('storageWarning').style.display='block'; trades=[]; render(); return; }
    try {
      const raw=localStorage.getItem(STORAGE_KEY), parsed=raw?JSON.parse(raw):[];
      trades=normalizeTransactions(parsed);
      if(raw&&JSON.stringify(parsed)!==JSON.stringify(trades)) saveTrades();
    } catch(e) { trades=[]; }
    render();
  }

    function saveTrades() {
    if (!hasLocalStorage()) {
      document.getElementById('storageWarning').style.display = 'block';
      return;
    }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(trades));
    } catch (e) {
      showToast('儲存失敗：瀏覽器的本機儲存空間可能已滿。建議先用「匯出 CSV」備份資料。', 'error');
    }
  }

  /* ---------- render ---------- */
  function render() {
    renderSummary();
    renderList();
    updateAutocomplete();
  }

  function updateAutocomplete() {
    const names = [];
    const tickers = [];
    trades.forEach(function(t) {
      if (t.stockName && names.indexOf(t.stockName) === -1) names.push(t.stockName);
      if (t.ticker && tickers.indexOf(t.ticker) === -1) tickers.push(t.ticker);
    });
    document.getElementById('stockNameList').innerHTML = names.map(function(n) {
      return '<option value="' + escapeHtml(n) + '"></option>';
    }).join('');
    document.getElementById('tickerList').innerHTML = tickers.map(function(t) {
      return '<option value="' + escapeHtml(t) + '"></option>';
    }).join('');
  }

  function todayDateStr() { const d=new Date(),p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
  function localDateTimeStr() { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
  function getLastUsedDefaults() {
    if(!trades.length) return {currency:'USD',fxRate:''};
    const last=trades.slice().sort((a,b)=>eventTime(a)-eventTime(b)).slice(-1)[0];
    return {currency:last.currency||'USD',fxRate:last.fxRate!=null?last.fxRate:''};
  }
  function setEventType(type) {
    const sell=type==='sell'; document.getElementById('eventTypeValue').value=sell?'sell':'buy';
    document.getElementById('eventFieldsTitle').textContent=sell?'賣出資訊':'買入資訊';
    document.getElementById('sharesFieldLabel').textContent=sell?'賣出股數':'買入股數';
    document.getElementById('dateFieldLabel').textContent=sell?'賣出日期時間':'買入日期';
    document.getElementById('priceFieldLabel').textContent=sell?'賣出股價':'買入股價';
    document.getElementById('fxFieldLabel').textContent=sell?'賣出匯率':'買入匯率';
    document.getElementById('eventDateInput').type=sell?'datetime-local':'date';
    document.getElementById('offsetHelp').style.display=sell?'block':'none';
  }
  function applyNewTradeDefaults(type) {
    const d=getLastUsedDefaults(),form=document.getElementById('tradeForm'); form.currency.value=d.currency;
    if(d.fxRate!=='') form.fxRate.value=d.fxRate;
    form.dateTime.value=type==='sell'?localDateTimeStr():todayDateStr();
  }
  function openNewTransaction(type, groupKey) {
    editingId=null; document.getElementById('modalTitle').textContent=type==='sell'?'新增賣出':'新增交易';
    const form=document.getElementById('tradeForm');form.reset();setEventType(type);applyNewTradeDefaults(type);
    if(type==='sell'&&groupKey){
      const group=groupTradesByStock(trades).find(function(g){return g.key===groupKey;});
      if(group){form.stockName.value=group.stockName;form.ticker.value=group.ticker;form.currency.value=group.currency;form.shares.value=group.metrics.remainingShares;if(group.metrics.sellAmountForeign)form.fxRate.value=group.metrics.sellFxRate;}
    }
    openModal();
  }

    function renderSummary() {
    const groups = groupTradesByStock(trades);
    const realizedGroups = groups.filter(function(g) { return g.metrics.realizedBasisTWD > 0; });
    const holdingGroups = groups.filter(function(g) { return g.metrics.remainingShares > 1e-8; });
    const totalPnl = realizedGroups.reduce(function(sum, g) { return sum + g.metrics.pnlTWD; }, 0);
    const realizedCost = realizedGroups.reduce(function(sum, g) { return sum + g.metrics.soldCostTWD; }, 0);
    const holdingCost = holdingGroups.reduce(function(sum, g) { return sum + g.metrics.remainingCostTWD; }, 0);
    const overallReturnPct = realizedCost ? totalPnl / realizedCost * 100 : null;
    document.getElementById('summaryTotal').textContent = trades.length;
    document.getElementById('summaryHolding').textContent = holdingGroups.length;
    const pnlEl = document.getElementById('summaryPnl');
    const pnlDot = document.getElementById('pnlDot');
    const pnlClass = totalPnl > 0 ? 'gain' : totalPnl < 0 ? 'loss' : '';
    pnlEl.textContent = realizedGroups.length ? formatSigned(totalPnl) : '--';
    pnlEl.className = 'hero-metric-value' + (pnlClass ? ' ' + pnlClass : '');
    pnlDot.className = 'hero-dot' + (pnlClass ? ' ' + pnlClass : ' dot-neutral');
    document.getElementById('summaryHoldingCost').textContent = holdingGroups.length ? formatTWD(holdingCost) : '--';
    updateReturnRing(overallReturnPct);
  }

  function updateReturnRing(returnPct) {
    const ring = document.getElementById('ringFill');
    const valueEl = document.getElementById('ringValue');
    const directionEl = document.getElementById('ringDirection');
    const circumference = 2 * Math.PI * 49;
    ring.setAttribute('stroke-dasharray', circumference.toFixed(2));
    ring.setAttribute('stroke-dashoffset', '0');

    if (returnPct === null) {
      ring.style.stroke = 'var(--rule-strong)';
      valueEl.style.color = 'var(--ink-soft)';
      valueEl.textContent = '--';
      directionEl.textContent = '';
      directionEl.classList.remove('loss');
      return;
    }

    const color = returnPct < 0 ? 'var(--loss)' : 'var(--gain)';
    ring.style.stroke = color;
    valueEl.style.color = 'var(--ink)';
    valueEl.textContent = (returnPct < 0 ? '-' : '') + Math.abs(returnPct).toFixed(1) + '%';
    directionEl.textContent = returnPct < 0 ? '▼' : '▲';
    directionEl.classList.toggle('loss', returnPct < 0);
  }

  function groupTradesByStock(records) {
    const buckets=Object.create(null);
    records.forEach(function(t) {
      const ticker=String(t.ticker||'').trim().toUpperCase(), key=stockIdentityKey(t);
      if(!buckets[key]) buckets[key]={key:key,ticker:ticker,stockName:t.stockName,currency:t.currency,trades:[]};
      buckets[key].trades.push(t);
    });
    return Object.keys(buckets).map(function(key) {
      const g=buckets[key];
      g.trades.sort(function(a,b){const diff=eventTime(a)-eventTime(b);if(diff)return diff;if(a.type===b.type)return 0;return a.type==='buy'?-1:1;});
      const m={buyShares:0,soldShares:0,remainingShares:0,openShortShares:0,buyCostTWD:0,soldCostTWD:0,remainingCostTWD:0,remainingForeignCost:0,remainingFxRate:0,remainingAvgPrice:0,sellAmountTWD:0,pnlTWD:0,realizedBasisTWD:0,priceEffect:0,fxEffect:0,buyAmountForeign:0,sellAmountForeign:0,buyFxWeighted:0,sellFxWeighted:0};
      const summaries=Object.create(null),longLots=[],shortLots=[],matches=[];
      g.trades.forEach(function(t){summaries[t.id]={event:t,matches:[],matchedShares:0,matchedBasisTWD:0,matchedPnlTWD:0,remainingShares:0,openShortShares:0};});
      function recordMatch(buy,sell,qty,side){
        const buyCost=(Number(buy.price)||0)*(Number(buy.fxRate)||0)*qty, proceeds=(Number(sell.price)||0)*(Number(sell.fxRate)||0)*qty;
        const pnl=proceeds-buyCost,basis=side==='short'?proceeds:buyCost;
        const match={buyEvent:buy,sellEvent:sell,shares:qty,side:side,buyCostTWD:buyCost,sellAmountTWD:proceeds,basisTWD:basis,pnlTWD:pnl,buyFxRate:Number(buy.fxRate)||0,sellFxRate:Number(sell.fxRate)||0};
        matches.push(match);
        [buy,sell].forEach(function(e){const q=summaries[e.id];q.matches.push(match);q.matchedShares+=qty;q.matchedBasisTWD+=basis;q.matchedPnlTWD+=pnl;});
        m.realizedBasisTWD+=basis;m.pnlTWD+=pnl;
        m.priceEffect+=((Number(sell.price)||0)-(Number(buy.price)||0))*qty*(Number(buy.fxRate)||0);
        m.fxEffect+=(Number(sell.price)||0)*qty*((Number(sell.fxRate)||0)-(Number(buy.fxRate)||0));
      }
      g.trades.forEach(function(t){
        const qty=Number(t.shares)||0,summary=summaries[t.id],foreign=(Number(t.price)||0)*qty;
        if(t.type==='buy'){

    /* ---------- toast & confirm (replace native alert/confirm: unstylable,

  function showToast(message, type) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast' + (type ? ' toast-' + type : '');
    toast.textContent = message;
    container.appendChild(toast);
    requestAnimationFrame(function() {
      requestAnimationFrame(function() { toast.classList.add('show'); });
    });
    setTimeout(function() {
      toast.classList.remove('show');
      setTimeout(function() { toast.remove(); }, 250);
    }, 3200);
  }

  function showConfirm(message, confirmLabel) {
    return new Promise(function(resolve) {
      const overlay = document.getElementById('confirmOverlay');
      const okBtn = document.getElementById('confirmOkBtn');
      const cancelBtn = document.getElementById('confirmCancelBtn');
      document.getElementById('confirmMessage').textContent = message;
      okBtn.textContent = confirmLabel || '確定';
      overlay.style.display = 'flex';

      function cleanup(result) {
        overlay.style.display = 'none';
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
        overlay.removeEventListener('click', onOverlay);
        resolve(result);
      }
      function onOk() { cleanup(true); }
      function onCancel() { cleanup(false); }
      function onOverlay(e) { if (e.target === overlay) cleanup(false); }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
      overlay.addEventListener('click', onOverlay);
    });
  }

    if (typeof window.showSaveFilePicker === 'function') {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: 'JSON 備份檔', accept: { 'application/json': ['.json'] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(content);
        await writable.close();
        showToast('備份已儲存到你選擇的位置。', 'success');
        return;
      } catch (error) {
        if (error && error.name === 'AbortError') return;
      }
    }

    const blob = new Blob([content], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    showToast(typeof window.showSaveFilePicker === 'function'
      ? '無法開啟儲存視窗，已改用瀏覽器下載。'
      : '此瀏覽器不支援選擇存放位置，已用瀏覽器下載。', 'success');
  }

  function importBackupFile(file) {
    const reader=new FileReader();reader.onload=async function(){
      let incoming;try{incoming=JSON.parse(reader.result);}catch(e){showToast('這個檔案不是有效的備份格式。','error');return;}
      if(!Array.isArray(incoming)){showToast('這個檔案不是有效的備份格式。','error');return;}
      const valid=normalizeTransactions(incoming).filter(isValidEvent);
      if(!valid.length){showToast('備份檔裡沒有有效的交易紀錄。','error');return;}
      const existing=Object.create(null);trades.forEach(function(t){existing[t.id]=true;});
      const fresh=valid.filter(function(t){return !existing[t.id];}),skipped=valid.length-fresh.length;
      const ok=await showConfirm('備份檔有 '+valid.length+' 筆買賣紀錄，其中 '+fresh.length+' 筆是新的'+(skipped?'，'+skipped+' 筆已存在會略過':'')+'。要還原新紀錄嗎？','還原');if(!ok)return;
      trades=trades.concat(fresh);saveTrades();render();showToast('已還原 '+fresh.length+' 筆交易紀錄','success');
    };reader.onerror=function(){showToast('讀取檔案時發生錯誤。','error');};reader.readAsText(file);
  }

  /* ---------- events ---------- */
  document.getElementById('addBtn').addEventListener('click',function(){openNewTransaction('buy');});
  document.getElementById('tradeList').addEventListener('click',function(e){
    const editButton=e.target.closest&&e.target.closest('[data-action="edit-trade"]');
    if(editButton){openEdit(editButton.dataset.tradeId);return;}
    const button=e.target.closest&&e.target.closest('[data-action="record-sale"]');if(!button)return;
    try{openNewTransaction('sell',decodeURIComponent(button.dataset.groupKey||''));}catch(error){showToast('無法開啟賣出表單，請重新整理後再試。','error');}
  });
  document.getElementById('cancelBtn').addEventListener('click',closeModal);
  document.getElementById('modal').addEventListener('click',function(e){if(e.target.id==='modal')closeModal();});
  document.getElementById('exportBtn').addEventListener('click',exportCSV);
  document.getElementById('clearBtn').addEventListener('click',clearAllData);
  document.getElementById('backupBtn').addEventListener('click',exportBackup);
  document.getElementById('restoreBtn').addEventListener('click',function(){document.getElementById('restoreFileInput').click();});
  document.getElementById('restoreFileInput').addEventListener('change',function(e){const file=e.target.files&&e.target.files[0];if(file)importBackupFile(file);e.target.value='';});

  Array.prototype.forEach.call(document.querySelectorAll('.view-tab'), function(btn) {
    btn.addEventListener('click', function() {
      Array.prototype.forEach.call(document.querySelectorAll('.view-tab'), function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentView = btn.dataset.view;
      renderList();
    });
  });

  document.getElementById('tableHeadRow').addEventListener('click', function(e) {
    const th = e.target.closest('th[data-sort]');
    if (!th) return;
    const key = th.dataset.sort;
    if (sortState.key === key) {
      sortState.dir *= -1;
    } else {
      sortState = { key: key, dir: 1 };
    }
    renderList();
  });

  document.getElementById('tradeForm').addEventListener('submit',function(e){
    e.preventDefault();const fd=new FormData(e.target),again=e.submitter&&e.submitter.id==='saveAddAnotherBtn';
    const event={id:editingId||makeTradeId(),type:fd.get('eventType'),stockName:(fd.get('stockName')||'').trim(),ticker:(fd.get('ticker')||'').trim().toUpperCase(),
      currency:((fd.get('currency')||'').trim()||'USD').toUpperCase(),shares:parseFloat(fd.get('shares')),dateTime:fd.get('dateTime'),price:parseFloat(fd.get('price')),fxRate:parseFloat(fd.get('fxRate')),notes:(fd.get('notes')||'').trim()};
    if(!isValidEvent(event)){showToast('請完整填寫股票、股數、日期、股價與匯率。','error');return;}
    if(editingId){const index=trades.findIndex(function(t){return t.id===editingId;});if(index>=0){const oldKey=stockIdentityKey(trades[index]);trades.forEach(function(t){if(stockIdentityKey(t)===oldKey){t.stockName=event.stockName;t.ticker=event.ticker;t.currency=event.currency;}});trades[index]=event;}}else trades.push(event);
    saveTrades();render();
    if(again){const stock=event.stockName,ticker=event.ticker,currency=event.currency;openNewTransaction(event.type);const form=document.getElementById('tradeForm');form.stockName.value=stock;form.ticker.value=ticker;form.currency.value=currency;form.stockName.focus();}else closeModal();
  });

    document.getElementById('searchInput').addEventListener('input', function(e) {
    searchQuery = e.target.value.trim().toLowerCase();
    renderList();
  });

  loadTrades();
</script>
</body>
</html>
